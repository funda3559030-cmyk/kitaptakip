<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kitap Takip</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
{% if session.logged_in %}
<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
  <div class="container-fluid px-lg-4">
    <a class="navbar-brand fw-bold" href="{{ url_for('library') }}">📚 Kitap Takip</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <form class="d-flex mx-lg-auto search-form" action="{{ url_for('search') }}" method="get">
        <input class="form-control" name="q" value="{{ query or '' }}" placeholder="Kitap ara..." aria-label="Kitap ara">
        <button class="btn btn-primary ms-2" type="submit"><i class="bi bi-search"></i></button>
      </form>
      <div class="navbar-nav ms-lg-3">
        <a class="nav-link" href="{{ url_for('library') }}">Kitaplık</a>
        <a class="nav-link" href="{{ url_for('stats') }}">İstatistik</a>
        <a class="nav-link" href="{{ url_for('settings') }}">Ayarlar</a>
        <a class="nav-link" href="{{ url_for('logout') }}">Çıkış</a>
      </div>
    </div>
  </div>
</nav>
{% endif %}
<main class="{% if session.logged_in %}container py-4{% endif %}">
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for message in messages %}<div class="alert alert-info">{{ message }}</div>{% endfor %}
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
